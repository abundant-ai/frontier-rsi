schema_version = "1.4"
artifacts = ["/app/submission", "/app/runs"]
[task]
name = "abundant/separated-prefill-and-decode"
description = "Real two-GPU prompt and decoding pipeline with timed state transfers."
[metadata]
author_name = "Abundant AI"
author_email = "kevin@abundant.ai"
author_organization = "Abundant"
category = "ml-research"
tags = ["inference", "prefill-decode", "H100", "research-rediscovery"]
reward_type = "continuous"
verification_explanation = "rsi-bench reward: after this grader runs (tests/grade_task.sh), tests/reward_90pct.py maps its raw metric to [0, 1] with the 90% best-trial rule: the best valid model trial in the rsi-bench collection scores 1, 90% of its performance or worse scores 0, linear in between; invalid runs score 0. The best value is fixed in tests/reward_90pct.json; the grader's own reward.json is kept as reward_grader.json."
[agent]
network_mode = "no-network"
timeout_sec = 14400
user = "agent"
[verifier]
network_mode = "no-network"
timeout_sec = 3600
user = "root"
environment_mode = "shared"
[environment]
network_mode = "no-network"
build_timeout_sec = 7200
cpus = 8
memory_mb = 65536
storage_mb = 32768
gpus = 2
gpu_types = ["H100"]
